name: Bug
description: Something is broken
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Pack version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log or crash report
      description: Attach latest.log or the crash report as a file. Screenshots of logs are not enough.
